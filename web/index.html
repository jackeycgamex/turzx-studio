<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TURZX Studio · 副屏工作台</title><link rel="icon" type="image/x-icon" href="favicon.ico?v=1"><link rel="icon" type="image/svg+xml" href="assets/turzx-studio.svg?v=1"><link rel="stylesheet" href="studio.css"></head>
<body>
<header class="topbar"><a class="brand" href="/" aria-label="副屏工作台首页"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M4 5h24v17H4zM11 27h10M16 22v5M9 10v7m7-7v7m7-7v7"/></svg><span>TURZX <b>Studio</b></span></a><span class="workspace-name">副屏工作台</span><div id="connection" class="connection"><i></i><span>正在连接</span></div></header>
<main class="workspace">
<aside class="channels" aria-label="页面选择"><div class="section-title"><h1>你的屏幕</h1><span>8 个场景</span></div><nav id="page-list"></nav><div class="sidebar-bottom"><span class="device-name">TURZX 5.2</span><span class="device-id">USB · 1CBE:0050</span><button id="info-toggle" class="text-button" aria-expanded="false">设备与能力说明 <span aria-hidden="true">↗</span></button></div></aside>
<section class="stage">
<div class="stage-heading"><div><h2 id="page-title">性能脉搏</h2><p id="page-description">看见电脑此刻的工作状态。</p></div><a href="display.html" target="_blank" rel="noopener" class="text-button open-display">独立预览 <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M11 3h6v6M17 3l-9 9M8 3H3v14h14v-5"/></svg></a></div>
<div class="preview-stage"><div class="preview-shell"><div id="preview-box" class="preview-box"><iframe id="display-preview" src="display.html" title="副屏实时预览"></iframe></div></div><div class="preview-caption"><span id="resolution-label">1280 × 720 · 横屏</span><span id="preview-status">浏览器预览</span></div></div>
<div id="notice" class="notice" role="status" aria-live="polite" hidden></div>
<div class="session-strip"><div><span>已发送</span><strong id="stat-frames">0 <small>帧</small></strong></div><div><span>最近传输</span><strong id="stat-latency">— <small>ms</small></strong></div><div><span>累计发送</span><strong id="stat-bytes">— <small>MiB</small></strong></div><div class="signal-state"><span>数据状态</span><strong id="data-state">等待采样</strong></div></div>
<section id="device-details" class="device-details" hidden><div class="details-title"><h3>关于这块屏幕</h3><button id="info-close" class="text-button">收起</button></div><div id="device-facts"><p>正在读取设备资料…</p></div></section>
<div class="scene-guidance"><span id="guidance-mark" aria-hidden="true"></span><p id="scene-guidance">数据来自当前电脑。无法读取的传感器保留为「未接入」。</p></div>
</section>
<aside class="mixer" aria-label="屏幕设置"><section class="output-section"><h2>屏幕输出</h2><p id="output-summary">预览就绪后，即可开始投屏。</p><div class="output-buttons"><button id="start-button" class="primary">开始投屏</button><button id="stop-button" class="secondary" disabled>停止</button></div></section>
<section class="control-section"><h3>显示</h3><label class="control-row" for="rotation"><span>方向</span><select id="rotation"><option value="270">横屏 · 270°</option><option value="90">横屏 · 90°</option><option value="0">竖屏 · 0°</option><option value="180">竖屏 · 180°</option></select></label><label class="control-row" for="fps"><span>发送帧率</span><select id="fps"><option value="1">1 fps · 静静看</option><option value="2" selected>2 fps · 日常</option><option value="5">5 fps · 动态</option><option value="10">10 fps · 探索</option></select></label><label class="range-label" for="brightness"><span>亮度</span><output id="brightness-value">未读取</output></label><input id="brightness" type="range" min="0" max="100" value="50" step="1" aria-label="屏幕亮度" disabled><p class="field-hint">开始投屏后，可调整实体屏亮度。</p></section>
<section class="control-section"><div class="switch-row"><label for="auto">自动换页</label><input id="auto" type="checkbox" role="switch"></div><label class="control-row" for="interval"><span>停留时间</span><select id="interval"><option value="10">10 秒</option><option value="20" selected>20 秒</option><option value="30">30 秒</option><option value="60">60 秒</option><option value="120">120 秒</option></select></label></section>
<section class="control-section focus-controls"><h3>专注计时</h3><div class="focus-readout"><strong id="focus-time">25:00</strong><span id="focus-state">准备开始</span></div><div class="button-pair"><button id="focus-start" class="secondary">开始专注</button><button id="focus-reset" class="text-button">重置</button></div></section>
<section class="control-section note-section"><label for="note"><h3>给自己的便签</h3></label><textarea id="note" maxlength="160" rows="3" placeholder="把注意力留给真正重要的事。"></textarea><div class="note-footer"><span id="note-count">0 / 160</span><button id="save-note" class="text-button">保存便签</button></div></section>
<footer class="mixer-footer">在电脑上选择，让副屏专心展示。</footer></aside>
</main><script src="studio.js"></script>
</body></html>
